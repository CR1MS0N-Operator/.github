name: Lint Commits

# Reusable workflow: called by every repository in the estate.
#
# The caller owns the trigger and this workflow owns the job, so the commit-range
# resolution lives in exactly one place. A caller is six lines and cannot drift.
#
# Two behaviours here are load-bearing and were measured, not assumed:
#   1. fetch-depth: 0 — commitlint throws "Cannot find merge-base" on a shallow clone.
#   2. the sentinel — commitlint exits 0 when a range resolves to nothing (a merge-only
#      push, or a backwards range), so "the job passed" does not mean "a commit was
#      linted". Counting non-merge commits turns that silent pass into a failure.
on:
  workflow_call:

jobs:
  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the shared policy
        uses: actions/checkout@v4
        with:
          repository: CR1MS0N-Operator/.github
          path: .shared
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install commitlint
        run: npm install --no-save --no-audit --no-fund @commitlint/cli@19 @commitlint/config-conventional@19

      # The config must sit beside this workspace's node_modules for `extends` to
      # resolve; passing a path from another directory with --config fails with
      # MODULE_NOT_FOUND (measured 2026-11-02).
      - name: Apply the shared config
        run: cp .shared/commitlint.config.cjs ./commitlint.config.cjs

      - name: Resolve the commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PUSH_TO: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            from="$PR_BASE"; to="$PR_HEAD"
          else
            from="$BEFORE"; to="$PUSH_TO"
          fi
          case "$from" in
            ""|0000000000000000000000000000000000000000)
              echo "::error::No usable 'before' sha on a $EVENT event; refusing to guess a range."
              exit 1 ;;
          esac
          count=$(git rev-list --no-merges --count "$from..$to")
          echo "range=\`$from..$to\` non_merge_commits=\`$count\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -eq 0 ]; then
            echo "::error::Vacuous run: no non-merge commits in $from..$to, so nothing would be linted."
            exit 1
          fi
          echo "from=$from" >> "$GITHUB_OUTPUT"
          echo "to=$to"   >> "$GITHUB_OUTPUT"

      - name: Lint the commits
        env:
          FROM: ${{ steps.range.outputs.from }}
          TO: ${{ steps.range.outputs.to }}
        run: npx commitlint --from "$FROM" --to "$TO" --verbose
